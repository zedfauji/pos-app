        retries: 3
    restart:
      policy: on-failure
      limit: 3

  reportingapi:
    command: dotnet
    args:
      - run
      - --project
      - solution/backend/ReportingApi/ReportingApi.csproj
      - --launch-profile
      - ReportingApi
    working_dir: .
    namespace: apis
    healthcheck:
      http:
        path: /health
        port: 5228
        interval: 5s
        timeout: 2s
        retries: 3
    restart:
      policy: on-failure
      limit: 3

